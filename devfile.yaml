schemaVersion: 2.3.0
metadata:
  name: devstral-dev-environment
  version: 1.0.0
  description: >
    Cloud development environment with Continue AI assistant and Mistral Vibe CLI,
    connected to self-hosted Devstral-Small-2-24B and Mistral Large 2407 FP8 models on RHOAI.
attributes:
  controller.devfile.io/storage-type: ephemeral

components:
  - name: dev
    container:
      image: quay.io/devfile/universal-developer-image:ubi10-latest
      memoryLimit: 8Gi
      memoryRequest: 4Gi
      cpuLimit: 4000m
      cpuRequest: 1000m
      mountSources: true
      sourceMapping: /projects
      # DEVSTRAL_ENDPOINT, DEVSTRAL_MODEL_NAME, DEVSTRAL_API_KEY,
      # MISTRAL_LARGE_ENDPOINT, MISTRAL_LARGE_MODEL_NAME, MISTRAL_LARGE_API_KEY
      # are injected automatically from the 'devstral-endpoint-config'
      # secret in the openshift-operators namespace.

commands:
  - id: install-vibe
    exec:
      component: dev
      commandLine: |
        pip install --user mistral-vibe && \
        echo "Mistral Vibe CLI installed successfully"

  - id: configure-vibe
    exec:
      component: dev
      commandLine: >
        mkdir -p /home/user/.vibe &&
        printf '[[providers]]\nname = "rhoai-devstral"\napi_base = "%s"\napi_key_env_var = "DEVSTRAL_API_KEY"\napi_style = "openai"\nbackend = "generic"\n\n[[models]]\nname = "%s"\nprovider = "rhoai-devstral"\nalias = "devstral-rhoai"\ntemperature = 0.1\n\nactive_model = "devstral-rhoai"\nenable_auto_update = false\n' "$DEVSTRAL_ENDPOINT" "$DEVSTRAL_MODEL_NAME" > /home/user/.vibe/config.toml &&
        echo "Mistral Vibe configured for RHOAI endpoints"

  - id: configure-continue
    exec:
      component: dev
      commandLine: >
        mkdir -p /home/user/.continue &&
        rm -f /home/user/.continue/config.json &&
        printf 'name: Local Config\nversion: 1.0.0\nschema: v1\n\nmodels:\n  - name: Devstral Small (ROSA cluster)\n    provider: openai\n    model: %s\n    apiBase: %s\n    apiKey: %s\n    roles:\n      - chat\n      - edit\n      - apply\n\ncontext:\n  - provider: code\n  - provider: docs\n  - provider: diff\n  - provider: terminal\n  - provider: problems\n  - provider: folder\n  - provider: codebase\n' "$DEVSTRAL_MODEL_NAME" "$DEVSTRAL_ENDPOINT" "$DEVSTRAL_API_KEY" > /home/user/.continue/config.yaml &&
        echo "Continue config.yaml written for RHOAI endpoints"

events:
  postStart:
    - install-vibe
    - configure-vibe
    - configure-continue

