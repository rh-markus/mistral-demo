schemaVersion: 2.3.0
metadata:
  name: devstral-dev-environment
  version: 1.0.0
  description: >
    Cloud development environment with Continue AI assistant and Mistral Vibe CLI,
    connected to self-hosted Devstral-Small-2-24B and Mistral Large 2407 FP8 models on RHOAI.
attributes:
  controller.devfile.io/storage-type: ephemeral

components:
  - name: dev
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 8Gi
      memoryRequest: 4Gi
      cpuLimit: 4000m
      cpuRequest: 1000m
      mountSources: true
      sourceMapping: /projects
      # DEVSTRAL_ENDPOINT, DEVSTRAL_MODEL_NAME, DEVSTRAL_API_KEY,
      # MISTRAL_LARGE_ENDPOINT, MISTRAL_LARGE_MODEL_NAME, MISTRAL_LARGE_API_KEY
      # are injected automatically from the 'devstral-endpoint-config'
      # secret in the openshift-operators namespace.

commands:
  - id: install-continue
    exec:
      component: dev
      commandLine: |
        code --install-extension Continue.continue --force && \
        echo "Continue extension installed successfully"

  - id: install-vibe
    exec:
      component: dev
      commandLine: |
        pip install --user mistral-vibe && \
        echo "Mistral Vibe CLI installed successfully"

  - id: configure-vibe
    exec:
      component: dev
      commandLine: |
        mkdir -p /home/user/.vibe && \
        cat > /home/user/.vibe/config.toml << VIBEEOF
        [[providers]]
        name = "rhoai-devstral"
        api_base = "${DEVSTRAL_ENDPOINT}"
        api_key_env_var = "DEVSTRAL_API_KEY"
        api_style = "openai"
        backend = "generic"

        [[providers]]
        name = "rhoai-mistral-large"
        api_base = "${MISTRAL_LARGE_ENDPOINT}"
        api_key_env_var = "MISTRAL_LARGE_API_KEY"
        api_style = "openai"
        backend = "generic"

        [[models]]
        name = "${DEVSTRAL_MODEL_NAME}"
        provider = "rhoai-devstral"
        alias = "devstral-rhoai"
        temperature = 0.1

        [[models]]
        name = "${MISTRAL_LARGE_MODEL_NAME}"
        provider = "rhoai-mistral-large"
        alias = "mistral-large-rhoai"
        temperature = 0.1

        active_model = "devstral-rhoai"
        enable_auto_update = false
        VIBEEOF
        echo "Mistral Vibe configured for RHOAI endpoints"

  - id: configure-continue
    exec:
      component: dev
      commandLine: |
        mkdir -p /home/user/.continue && \
        export MISTRAL_LARGE_MODEL_NAME="$git {MISTRAL_LARGE_MODEL_NAME}" && \
        export MISTRAL_LARGE_ENDPOINT="${MISTRAL_LARGE_ENDPOINT}" && \
        export DEVSTRAL_MODEL_NAME="${DEVSTRAL_MODEL_NAME}" && \
        export DEVSTRAL_ENDPOINT="${DEVSTRAL_ENDPOINT}" && \
        export DEVSTRAL_API_KEY="${DEVSTRAL_API_KEY}" && \
        envsubst << 'TEMPLATE' > /home/user/.continue/config.yaml
        name: Local Config
        version: 1.0.0
        schema: v1

        models:
          - name: Mistral Large (BU Cluster)
            provider: openai
            model: ${MISTRAL_LARGE_MODEL_NAME}
            apiBase: ${MISTRAL_LARGE_ENDPOINT}
            apiKey: none

          - name: Devstral Small (ROSA cluster)
            provider: openai
            model: ${DEVSTRAL_MODEL_NAME}
            apiBase: ${DEVSTRAL_ENDPOINT}
            apiKey: ${DEVSTRAL_API_KEY}

        context:
          - provider: code
          - provider: docs
          - provider: diff
          - provider: terminal
          - provider: problems
          - provider: folder
          - provider: codebase
        TEMPLATE
        echo "Continue extension configured for RHOAI endpoints"

events:
  postStart:
    - install-continue
    - configure-continue
    # - install-vibe
    # - configure-vibe
